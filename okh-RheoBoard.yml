made: false
made-independently: false

health-safety-notice: >
  Involves a mains-powered 12 V DC adapter, soldered wiring, and generated pneumatic
  pressure/vacuum. Risks: electric shock from mishandled mains wiring, burns from soldering,
  and pressurized-air hazards (do not point tubing/nozzles at eyes; keep pressures modest).
  Never route pump/valve current through the ESP32's 5 V pin. Air pumps are ~4.5 V parts on a
  12 V rail — limit duty cycle to avoid overheating.

