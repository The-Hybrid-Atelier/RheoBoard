project-link: https://github.com/The-Hybrid-Atelier/RheoBoard
documentation-home: https://github.com/The-Hybrid-Atelier/RheoBoard/blob/main/BuildYourOwn/README.md
image: BuildYourOwn/images/teaser.jpg

contact:
  name: Charlie Vuong
  affiliation: The Hybrid Atelier
  email: hxv6892@mavs.uta.edu

version: "2"
development-stage: prototype
# version "2" is the DIY build with a 3D-printed panel. Version 1 (laser-cut panel)
# is the OSHWA-certified build (US002865), frozen at the v1 git tag. Neither is the KiCad board
# (whose own silkscreen label is "Rheoboard V1").
made: false
made-independently: false

health-safety-notice: >
  Involves a mains-powered 12 V DC adapter, soldered wiring, and generated pneumatic
  pressure/vacuum. Risks: electric shock from mishandled mains wiring, burns from soldering,
  and pressurized-air hazards (do not point tubing/nozzles at eyes; keep pressures modest).
  Never route pump/valve current through the ESP32's 5 V pin. Air pumps are ~4.5 V parts on a
  12 V rail — limit duty cycle to avoid overheating.

