title: RheoBoard
description: >
  A low-cost, DIY benchtop pneumatic "pull-push" rheometer head built from off-the-shelf
  modules. Two air pump/vacuum motors and one solenoid air valve, mounted on a 3D-printed
  PLA panel and driven by an ESP32 microcontroller through two L298N H-bridge drivers
  (controlled via an Adafruit PCA9685 16-channel PWM driver, product 815, I2C 0x40), run a
  retract-extrude pulse (REP) on command while a Qwiic MicroPressure sensor streams the
  pressure trace over BLE. A separate KiCad PCB prototype lives under RheoBoard_PCB and is not
  this DIY build. Open hardware supporting the RheoMap, RheoData, and SlipAtlas projects.
intended-use: >
  Bench research and teaching instrument for characterizing the pneumatic pressure response of
  soft/viscous samples. Built and operated by makers, students, and researchers comfortable with
  the Arduino IDE and reading wiring diagrams. Soldering is only needed when headers or actuator
  leads are not already fitted. Not a medical or safety-critical device.

